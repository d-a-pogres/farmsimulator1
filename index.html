<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Сельскохозяйственный симулятор</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <header class="toolbar">
      <div class="tools">
        <button data-tool="shovel">Лопата</button>
        <button data-tool="seed-bog">Семена болотника</button>
        <button data-tool="seed-potato">Семена картошки</button>
        <button data-tool="seed-cactus">Семена кактуса</button>
        <button data-tool="bucket-add">Ведро: вылить воду</button>
        <button data-tool="bucket-remove">Ведро: забрать воду</button>
      </div>
      <div class="status">
        <span id="selected-tool">Инструмент: Лопата</span>
      </div>
    </header>

    <main>
      <canvas id="grid" width="800" height="800" aria-label="Игровая сетка"></canvas>
    </main>

    <footer>
      <p>ЛКМ: применить инструмент на клетке. Симуляция с шагом роста раз в 1 секунду.</p>
    </footer>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
